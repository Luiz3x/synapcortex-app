<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle - SynapCortex</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css', v='4.1') }}">
</head>
<body>
    <header>
        <nav>
            <a href="{{ url_for('index') }}" class="logo"><img src="{{ url_for('static', filename='images/synapcortex_logo_white.png') }}" alt="Logo"></a>
            <span>Painel de: {{ usuario.nome_empresa }}</span>
            <a href="{{ url_for('logout') }}" class="login-register-button">Sair</a>
        </nav>
    </header>

    <div class="dashboard-container">
        <div class="secao-painel">
            <h3>Visão Geral (O Cérebro da Operação)</h3>
            </div>

        <div class="dashboard-main-content">
            <form id="config-form" method="POST" action="{{ url_for('salvar_configuracoes') }}">
                <div class="dashboard-grid-principal">
                    <div class="secao-painel-coluna">
                        <div class="secao-painel" id="detetive-section">
                            <h3>🕵️ Quarto do Detetive</h3>
                            </div>
                    </div>
                    <div class="secao-painel-coluna">
                        <div class="secao-painel">
                            <h3>🚀 Arsenal de Gatilhos</h3>
                            </div>
                    </div>
                </div>
                <div id="campaign-section" class="secao-painel secao-full-width">
                    </div>
                <button type="submit" class="cta-button" style="width: 100%; max-width: 500px; margin: 2rem auto 0; display: block;">Salvar Todas as Configurações</button>
            </form>
        </div>

        <div id="help-section" class="secao-painel secao-full-width">
            </div>
        <div class="secao-painel secao-full-width">
            </div>
    </div>

    <div id="helpModal" class="modal"></div>
    <div id="loginRegisterModal" class="modal"></div>
    <script src="{{ url_for('static', filename='js/main_logic.js') }}"></script>
</body>
</html>
