<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle - SynapCortex</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <nav>
            <a href="{{ url_for('index') }}" class="logo"><img src="{{ url_for('static', filename='images/synapcortex_logo.png') }}" alt="Logo"></a>
            <span>Painel de: {{ usuario.nome_empresa }}</span>
            <a href="{{ url_for('logout') }}" class="login-register-button">Sair</a>
        </nav>
    </header>

    <div class="dashboard-container">

        <div class="secao-painel">
            <h3>Visão Geral (O Cérebro da Operação)</h3>
            <div class="metric-grid">
                </div>
        </div>

        <div class="dashboard-grid-principal">
            
            <div class="secao-painel" id="detetive-section">
                <h3>🕵️ Quarto do Detetive</h3>
                <a href="{{ url_for('visitors') }}" class="cta-button" style="width:100%; margin-top: 1.5rem; text-align: center;">Ver Dossiê Completo</a>
            </div>

            <form id="config-form" class="secao-painel">
                <h3>🚀 Arsenal de Gatilhos</h3>
                </form>

            <div class="secao-painel secao-full-width">
                <h3>🔥 Quarto Black Friday (Campanhas Sazonais)</h3>
                </div>

            <div class="secao-painel secao-full-width">
                <h3><span class="icon">💡</span> Central de Ajuda Interativa</h3>
                </div>

            <div class="secao-painel secao-full-width">
                <h3><span class="icon">🔑</span> Sua Chave de API e Código de Instalação</h3>
                </div>

        </div> </div>

    <div id="helpModal" class="modal"></div>
    <script src="{{ url_for('static', filename='js/main_logic.js') }}"></script>
</body>
</html>
