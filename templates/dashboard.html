<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle - SynapCortex</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        /* ... (todos os nossos estilos do dashboard continuam aqui) ... */
    </style>
</head>
<body>
    <header>
        </header>

    <div class="dashboard-container">
        
        <div class="secao-painel">
            <h3>Visão Geral (O Cérebro da Operação)</h3>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 2rem; text-align: center; margin-top: 1.5rem;">
                <div>
                    <h4 style="color: var(--text-fade); font-weight: 500;">Pop-ups Exibidos</h4>
                    <p style="font-size: 2.5rem; font-weight: 700; color: var(--accent-blue);">{{ popups_exibidos }}</p>
                    <small>(Total)</small>
                </div>
                <div>
                    <h4 style="color: var(--text-fade); font-weight: 500;">Clientes Recuperados</h4>
                    <p style="font-size: 2.5rem; font-weight: 700;">0</p>
                    <small>(Em breve)</small>
                </div>
                <div>
                    <h4 style="color: var(--text-fade); font-weight: 500;">Taxa de Conversão</h4>
                    <p style="font-size: 2.5rem; font-weight: 700;">0.00%</p>
                    <small>(Em breve)</small>
                </div>
            </div>
        </div>

        </div>

    </body>
</html>
