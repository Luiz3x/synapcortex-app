<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle - SynapCortex</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        /* ... (todos os estilos anteriores do dashboard continuam aqui) ... */

        /* [NOVO] Estilos para a Central de Ajuda */
        .help-center-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 1rem;
            margin-top: 1.5rem;
        }
        .platform-button {
            background-color: var(--primary-blue-dark);
            border: 1px solid #2a3b4c;
            border-radius: 8px;
            padding: 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-color);
        }
        .platform-button:hover {
            border-color: var(--accent-blue);
            transform: translateY(-5px);
        }
        .platform-button img {
            height: 40px;
            margin-bottom: 0.5rem;
        }
        /* Estilos para o Modal de Ajuda */
        .help-modal { display: none; /* ... (estilos do modal que já conhecemos) ... */ }
        .help-modal-content { /* ... (estilos do modal content que já conhecemos) ... */ }
    </style>
</head>
<body>
    <header>
        </header>

    <div class="dashboard-container">
        
        <div class="secao-painel">
            <h3>Visão Geral</h3>
            </div>

        <div class="secao-painel">
            <h3>Central de Ajuda Interativa</h3>
            <p>Não sabe como instalar o código? Clique na sua plataforma abaixo para ver um guia passo a passo. Leva menos de 60 segundos!</p>
            <div class="help-center-grid">
                <button class="platform-button" data-platform="shopify">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/0/0e/Shopify_logo_2018.svg" alt="Shopify">
                    <span>Shopify</span>
                </button>
                <button class="platform-button" data-platform="woocommerce">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/2/2a/WooCommerce_logo.svg" alt="WooCommerce">
                    <span>WooCommerce</span>
                </button>
                <button class="platform-button" data-platform="nuvemshop">
                    <img src="https://s3.amazonaws.com/gupy5/production/companies/3133/career/3089/images/2021-08-12_17-21_logo.png" alt="Nuvemshop">
                    <span>Nuvemshop</span>
                </button>
                 <button class="platform-button" data-platform="outra">
                    <img src="https://static.thenounproject.com/png/226359-200.png" alt="Outra Plataforma" style="filter: invert(1);">
                    <span>Outra</span>
                </button>
            </div>
             </div>


        <div class="secao-painel">
            <h3>Sua Chave de API e Código de Instalação</h3>
            </div>

        <form id="config-form">
            </form>
    </div>

    <div id="helpModal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h2 id="helpModalTitle">Instalando na Shopify</h2>
            <div id="helpModalContent">
                <p>Aqui entrará o passo a passo...</p>
            </div>
        </div>
    </div>


    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // ... (todo o javascript antigo do dashboard para copiar código e salvar o form) ...

            // [NOVO] Lógica para a Central de Ajuda
            const helpModal = document.getElementById('helpModal');
            const helpModalTitle = document.getElementById('helpModalTitle');
            const helpModalContent = document.getElementById('helpModalContent');
            const closeModalBtn = helpModal.querySelector('.close-button');

            document.querySelectorAll('.platform-button').forEach(button => {
                button.addEventListener('click', function() {
                    const platform = this.dataset.platform;
                    
                    // Futuramente, aqui teremos o conteúdo para cada plataforma
                    if (platform === 'shopify') {
                        helpModalTitle.textContent = 'Instalando na Shopify (Menos de 60s)';
                        helpModalContent.innerHTML = `
                            <ol>
                                <li><strong>Acesse o Código do seu Tema:</strong> No seu painel Shopify, no menu da esquerda, clique em "Loja Virtual" e depois em "Temas".</li>
                                <li><strong>Edite o Código Principal:</strong> No seu tema atual, clique no botão com três pontinhos (...) e escolha a opção "Editar código".</li>
                                <li><strong>Encontre o Arquivo 'theme.liquid':</strong> Na lista de arquivos, na seção "Layout", clique no arquivo chamado 'theme.liquid'.</li>
                                <li><strong>Cole o Código:</strong> Role o arquivo até o final e cole o seu código da SynapCortex logo acima da linha que diz <code>&lt;/body&gt;</code>.</li>
                                <li><strong>Salve e Comemore!</strong> Clique no botão "Salvar". Pronto!</li>
                            </ol>
                        `;
                    } else {
                        helpModalTitle.textContent = 'Guia de Instalação';
                        helpModalContent.innerHTML = '<p>As instruções para esta plataforma estarão disponíveis em breve!</p>';
                    }

                    helpModal.style.display = 'flex';
                });
            });

            closeModalBtn.onclick = () => { helpModal.style.display = 'none'; };
            window.onclick = event => { if (event.target == helpModal) { helpModal.style.display = 'none'; } };
        });
    </script>
</body>
</html>
