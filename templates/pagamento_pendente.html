<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalize sua Assinatura - SynapCortex</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css', v='8.1') }}">
    <script src="https://js.stripe.com/v3/"></script>
    <style>
        /* Estilos adicionais para o spinner de carregamento */
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid #fff;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="{{ url_for('index') }}" class="logo"><img src="{{ url_for('static', filename='images/synapcortex_logo_white.png') }}" alt="SynapCortex Logo"></a>
        </nav>
    </header>

    <div class="dashboard-container" style="max-width: 500px; margin-top: 4rem;">
        <div class="secao-painel">
            <h3>Quase lá! Finalize sua assinatura.</h3>
            <p class="quarto-description" style="margin-bottom: 2rem; margin-top: 1rem;">Seu período de teste terminou. Continue tendo acesso a todas as ferramentas da SynapCortex para maximizar suas vendas.</p>

            <form id="payment-form">
                <div class="input-group">
                    <label for="card-element" style="font-weight: bold; color: var(--text-primary);">Dados do Cartão de Crédito</label>
                    <div id="card-element" style="padding: 14px; background-color: var(--secondary-dark); border-radius: var(--border-radius); border: 1px solid var(--glass-border); margin-top: 0.5rem;">
                        </div>
                </div>

                <div id="card-errors" role="alert" style="color: #dc3545; margin-bottom: 1.5rem; min-height: 1.2em;"></div>

                <button id="submit-button" class="cta-button" style="width: 100%; height: 50px; display: flex; align-items: center; justify-content: center;">
                    <div class="spinner hidden" id="spinner"></div>
                    <span id="button-text">Assinar Agora (R$ 49,90/mês)</span>
                </button>
            </form>

            <div style="text-align: center; margin-top: 2rem; color: var(--text-secondary); font-size: 0.9rem;">
                <p>🔒 Pagamento seguro processado pela Stripe.</p>
            </div>
        </div>
    </div>
    
    <script>
        const stripePublicKey = "{{ stripe_public_key }}";
    </script>
    <script src="{{ url_for('static', filename='js/checkout.js', v='1.0') }}"></script>
</body>
</html>
