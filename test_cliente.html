<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site de Teste para SynapCortex</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f8ff;
            color: #333;
        }
        .container {
            text-align: center;
            padding: 2rem;
            border: 2px dashed #00bfff;
            border-radius: 15px;
            background-color: #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 { color: #050a14; }
        p { font-size: 1.2rem; }
        strong { color: #d9534f; }
        code {
            background-color: #e9e9e9;
            padding: 3px 6px;
            border-radius: 4px;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Este é um Site de Teste</h1>
        <p>O espião da SynapCortex está instalado e vigiando esta página.</p>
        <p>Siga as instruções para testar os gatilhos.</p>
    </div>

    <script 
        id="synapcortex-spy-script"
        src="https://synapcortex-app.onrender.com/static/js/spy.js?key=SUA_CHAVE_DE_API_AQUI"
        data-backend-url="https://synapcortex-app.onrender.com"
        defer>
    </script>

</body>
</html>
